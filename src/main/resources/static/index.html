<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libris - Gestão de Livraria & Acervo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            book: {
              violet: '#8b5cf6',
              purple: '#a855f7',
              pink: '#ec4899',
              dark: '#0b0c14',
              surface: '#121526',
              card: '#1a1e36',
              cardHover: '#23294a',
              border: '#2e375d',
              subtext: '#94a3b8'
            }
          },
          boxShadow: {
            'glow-violet': '0 0 25px -5px rgba(139, 92, 246, 0.4)',
            'glow-pink': '0 0 25px -5px rgba(236, 72, 153, 0.3)',
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0c14; color: white; }
    .hero-bg {
      background: radial-gradient(circle at 50% -20%, rgba(139, 92, 246, 0.28), transparent 70%),
      linear-gradient(180deg, #161233 0%, #0b0c14 100%);
    }
    .glass-card {
      background: rgba(26, 30, 54, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-modal {
      background: rgba(15, 17, 30, 0.94);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .text-gradient {
      background: linear-gradient(135deg, #a78bfa 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-book-dark text-white min-h-screen selection:bg-violet-500 selection:text-white">
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  const Icons = {
    Book: ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
    ),
    Home: ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
            </svg>
    ),
    Plus: ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path d="M12 5v14M5 12h14"/>
            </svg>
    ),
    Search: ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-4-4"/>
            </svg>
    ),
    Edit: ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="m15 5 4 4M4 20l4-.8L20 7a2.8 2.8 0 0 0-4-4L4 15z"/>
            </svg>
    ),
    Trash: ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>
            </svg>
    ),
    Eye: ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
    ),
    Sparkles: ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/>
            </svg>
    ),
    Image: ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
    )
  };

  const DEMO_LIVROS = [
    { id: 1, titulo: "Os Maias", categoria: "FICCAO", autor: "Eça de Queirós", isbn: "978-972-0-00001-1", anoPublicacao: 1888, preco: 16.90, quantidadeEstoque: 24, disponivel: true, resumo: "Uma obra-prima do Realismo português que narra a história da família Maia ao longo de três gerações.", imagemUrl: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80" },
    { id: 2, titulo: "Ensaio sobre a Cegueira", categoria: "FICCAO", autor: "José Saramago", isbn: "978-972-0-00002-8", anoPublicacao: 1995, preco: 18.50, quantidadeEstoque: 8, disponivel: true, resumo: "Uma epidemia de cegueira branca espalha-se por uma cidade, revelando o melhor e o pior da condição humana.", imagemUrl: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=80" },
    { id: 3, titulo: "Clean Code", categoria: "TECNICO", autor: "Robert C. Martin", isbn: "978-013-235088-4", anoPublicacao: 2008, preco: 42.00, quantidadeEstoque: 15, disponivel: true, resumo: "Guia prático de desenvolvimento de software para escrever código limpo, legível e de fácil manutenção.", imagemUrl: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&q=80" },
    { id: 4, titulo: "Sapiens: História Breve da Humanidade", categoria: "NAO_FICCAO", autor: "Yuval Noah Harari", isbn: "978-989-657-543-4", anoPublicacao: 2011, preco: 21.90, quantidadeEstoque: 30, disponivel: true, resumo: "Uma jornada pela evolução da humanidade desde a Idade da Pedra até aos avanços da biotecnologia.", imagemUrl: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&q=80" },
    { id: 5, titulo: "Steve Jobs", categoria: "BIOGRAFIA", autor: "Walter Isaacson", isbn: "978-989-660-123-2", anoPublicacao: 2011, preco: 24.50, quantidadeEstoque: 2, disponivel: true, resumo: "A biografia autorizada do cofundador da Apple baseada em mais de quarenta entrevistas.", imagemUrl: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=400&q=80" }
  ];

  const EMPTY = {
    titulo: '',
    categoria: 'FICCAO',
    autor: '',
    isbn: '',
    anoPublicacao: '',
    preco: '',
    quantidadeEstoque: '',
    disponivel: true,
    resumo: '',
    imagemUrl: ''
  };

  function App() {
    const [tela, setTela] = useState('principal');
    const [apiUrl, setApiUrl] = useState('http://localhost:8080/api/livros');
    const [urlEdit, setUrlEdit] = useState(apiUrl);
    const [showConfig, setShowConfig] = useState(false);
    const [statusApi, setStatusApi] = useState('carregando');
    const [erroDetalhe, setErroDetalhe] = useState('');
    const [livros, setLivros] = useState([]);
    const [busca, setBusca] = useState('');
    const [filtro, setFiltro] = useState('TODOS');
    const [ordenacao, setOrdenacao] = useState('RECENTES');
    const [form, setForm] = useState(EMPTY);
    const [editando, setEditando] = useState(null);
    const [deletando, setDeletando] = useState(null);
    const [visualizando, setVisualizando] = useState(null);
    const [toast, setToast] = useState(null);
    const [carregando, setCarregando] = useState(false);

    const avisar = (mensagem, tipo = 'info') => {
      setToast({ mensagem, tipo });
      setTimeout(() => setToast(null), 3800);
    };

    const request = async (path = '', options = {}) => {
      const res = await fetch(`${apiUrl.replace(/\/$/, '')}${path}`, options);
      if (!res.ok) throw new Error(`Status ${res.status}`);
      if (res.status === 204) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    };

    const carregarLivros = async () => {
      setCarregando(true);
      setErroDetalhe('');
      try {
        const dados = await request();
        setLivros(Array.isArray(dados) && dados.length > 0 ? dados : DEMO_LIVROS);
        setStatusApi('conectado');
      } catch (e) {
        setStatusApi('erro');
        setErroDetalhe(e.message || 'Sem conexão com a API backend.');
        setLivros(DEMO_LIVROS);
      } finally {
        setCarregando(false);
      }
    };

    useEffect(() => { carregarLivros(); }, [apiUrl]);

    const guardar = async (e) => {
      e.preventDefault();
      const dados = {
        ...form,
        anoPublicacao: form.anoPublicacao === '' ? null : Number(form.anoPublicacao),
        preco: form.preco === '' ? null : Number(form.preco),
        quantidadeEstoque: form.quantidadeEstoque === '' ? null : Number(form.quantidadeEstoque)
      };
      try {
        if (statusApi === 'conectado') {
          if (editando !== null) {
            await request('/' + editando, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(dados)
            });
          } else {
            await request('', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(dados)
            });
          }
          await carregarLivros();
        } else {
          if (editando !== null) {
            setLivros(livros.map(l => l.id === editando ? { ...dados, id: editando } : l));
          } else {
            setLivros([{ ...dados, id: Date.now() }, ...livros]);
          }
        }
        avisar(editando !== null ? 'Livro atualizado com sucesso!' : 'Livro registado com sucesso!', 'sucesso');
        setForm(EMPTY);
        setEditando(null);
        setTela('principal');
      } catch (err) {
        avisar(`Erro ao guardar: ${err.message}`, 'erro');
      }
    };

    const editar = (l) => {
      setForm({
        titulo: l.titulo || '',
        categoria: l.categoria || 'FICCAO',
        autor: l.autor || '',
        isbn: l.isbn || '',
        anoPublicacao: l.anoPublicacao ?? '',
        preco: l.preco ?? '',
        quantidadeEstoque: l.quantidadeEstoque ?? '',
        disponivel: l.disponivel ?? true,
        resumo: l.resumo || '',
        imagemUrl: l.imagemUrl || ''
      });
      setEditando(l.id);
      setVisualizando(null);
      setTela('cadastro');
    };

    const eliminar = async (id) => {
      try {
        if (statusApi === 'conectado') {
          await request('/' + id, { method: 'DELETE' });
          await carregarLivros();
        } else {
          setLivros(livros.filter(l => l.id !== id));
        }
        avisar('Livro removido do acervo!', 'sucesso');
        setDeletando(null);
      } catch (err) {
        avisar(`Não foi possível eliminar: ${err.message}`, 'erro');
      }
    };

    const filtrados = useMemo(() => {
      let lista = livros.filter(l => {
        const texto = [l.titulo, l.autor, l.isbn, l.categoria].filter(Boolean).join(' ').toLowerCase();
        return texto.includes(busca.toLowerCase()) && (filtro === 'TODOS' || l.categoria === filtro);
      });

      if (ordenacao === 'PRECO_MENOR') lista.sort((a,b) => (a.preco||0) - (b.preco||0));
      if (ordenacao === 'PRECO_MAIOR') lista.sort((a,b) => (b.preco||0) - (a.preco||0));
      if (ordenacao === 'STOCK') lista.sort((a,b) => (b.quantidadeEstoque||0) - (a.quantidadeEstoque||0));

      return lista;
    }, [livros, busca, filtro, ordenacao]);

    const totalExemplares = livros.reduce((acc, curr) => acc + (Number(curr.quantidadeEstoque) || 0), 0);
    const valorTotalAcervo = livros.reduce((acc, curr) => acc + ((Number(curr.preco) || 0) * (Number(curr.quantidadeEstoque) || 0)), 0);

    const getCategoriaBadge = (cat) => {
      const mapa = {
        FICCAO: 'bg-violet-500/10 text-violet-300 border-violet-500/30',
        NAO_FICCAO: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30',
        TECNICO: 'bg-sky-500/10 text-sky-300 border-sky-500/30',
        BIOGRAFIA: 'bg-amber-500/10 text-amber-300 border-amber-500/30',
        INFANTIL: 'bg-pink-500/10 text-pink-300 border-pink-500/30'
      };
      return mapa[cat] || 'bg-slate-500/10 text-slate-300 border-slate-500/30';
    };

    const field = 'w-full bg-book-dark/90 border border-book-border/80 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-500/20 transition-all';
    const label = 'block text-book-subtext font-bold mb-2 uppercase tracking-wider text-[10px]';

    return (
            <div className="flex min-h-screen bg-book-dark text-white">
              {toast && (
                      <div className={`fixed top-6 right-6 z-[80] px-5 py-3.5 rounded-2xl text-xs font-bold shadow-glow-violet border backdrop-blur-xl flex items-center gap-3 transition-all transform animate-bounce ${
                              toast.tipo === 'sucesso' ? 'bg-book-card/90 text-violet-300 border-violet-500/50' : 'bg-book-card/90 text-rose-400 border-rose-500/50'
                      }`}>
                        <Icons.Sparkles size={16}/>
                        <span>{toast.mensagem}</span>
                      </div>
              )}

              {/* Sidebar Lateral */}
              <aside className="w-72 bg-[#0d0e1a] p-6 hidden lg:flex flex-col justify-between border-r border-book-border/50">
                <div className="space-y-8">
                  <div className="flex items-center gap-3 px-2">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-pink-500 flex items-center justify-center shadow-glow-violet">
                      <Icons.Book size={22}/>
                    </div>
                    <div>
                      <span className="text-2xl font-black tracking-tight">Libr<span className="text-gradient">is</span></span>
                      <span className="block text-[9px] text-book-subtext tracking-widest font-bold uppercase">Gestão de Acervo</span>
                    </div>
                  </div>

                  <nav className="space-y-2">
                    <button
                            onClick={() => setTela('principal')}
                            className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${tela === 'principal' ? 'bg-gradient-to-r from-violet-600/30 to-purple-600/10 text-violet-300 border border-violet-500/30 shadow-glow-violet' : 'text-book-subtext hover:text-white hover:bg-book-card/50'}`}
                    >
                      <Icons.Home/> O Meu Acervo
                    </button>
                    <button
                            onClick={() => { setForm(EMPTY); setEditando(null); setTela('cadastro'); }}
                            className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${tela === 'cadastro' ? 'bg-gradient-to-r from-violet-600/30 to-purple-600/10 text-violet-300 border border-violet-500/30 shadow-glow-violet' : 'text-book-subtext hover:text-white hover:bg-book-card/50'}`}
                    >
                      <Icons.Plus/> Registar Novo Livro
                    </button>
                  </nav>
                </div>

                <div className="glass-card p-4 rounded-2xl">
                  <span className="text-book-subtext block text-[9px] uppercase font-extrabold tracking-wider mb-2">Estado da Conexão REST</span>
                  <div className="text-[11px] font-mono break-all mb-3 text-violet-300 bg-black/40 p-2 rounded-lg border border-white/5">{apiUrl}</div>
                  <div className="flex items-center justify-between gap-2">
            <span className="flex items-center gap-2 text-xs font-semibold">
              <span className="relative flex h-2.5 w-2.5">
                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${statusApi === 'conectado' ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${statusApi === 'conectado' ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
              </span>
              {statusApi === 'conectado' ? 'API Ativa' : 'Modo Demo'}
            </span>
                    <button onClick={() => { setUrlEdit(apiUrl); setShowConfig(true); }} className="text-xs text-violet-400 hover:underline font-bold">Alterar</button>
                  </div>
                </div>
              </aside>

              {/* Conteúdo Principal */}
              <main className="flex-1 min-w-0 flex flex-col">
                <header className="sticky top-0 z-30 bg-book-dark/80 backdrop-blur-xl border-b border-book-border/50 px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3 lg:hidden">
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-violet-600 to-pink-500 flex items-center justify-center">
                      <Icons.Book size={18}/>
                    </div>
                    <b className="text-lg tracking-tight">Libr<span className="text-gradient">is</span></b>
                  </div>

                  <div className="hidden lg:flex items-center gap-2 text-xs text-book-subtext font-semibold">
                    <span>LIVRARIA</span>
                    <span>/</span>
                    <span className="text-violet-400 font-bold">{tela === 'cadastro' ? 'NOVO REGISTO' : 'CATÁLOGO GERAL'}</span>
                  </div>

                  <div className="flex items-center gap-3">
                    <button onClick={() => carregarLivros()} className="px-4 py-2 rounded-xl border border-book-border text-xs font-bold hover:bg-book-card transition-all flex items-center gap-2">
                      <span className={carregando ? 'animate-spin' : ''}>↻</span>
                      <span className="hidden sm:inline">{carregando ? 'A Sincronizar...' : 'Atualizar'}</span>
                    </button>
                    <button onClick={() => { setForm(EMPTY); setEditando(null); setTela('cadastro'); }} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-pink-600 text-white text-xs font-black shadow-glow-violet hover:opacity-90 transition-all">
                      <Icons.Plus size={16}/> Novo Livro
                    </button>
                  </div>
                </header>

                <div className="p-6 md:p-8 max-w-7xl mx-auto w-full space-y-8">
                  {tela === 'principal' ? (
                          <>
                            {/* Hero Banner Visual */}
                            <section className="hero-bg rounded-3xl p-8 md:p-12 border border-violet-500/20 relative overflow-hidden shadow-2xl">
                              <div className="absolute top-0 right-0 -mt-12 -mr-12 w-64 h-64 bg-violet-600/10 rounded-full blur-3xl pointer-events-none"></div>
                              <div className="relative z-10 max-w-2xl space-y-4">
                  <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/10 text-violet-300 border border-violet-500/30 text-xs font-extrabold tracking-wider uppercase">
                    <Icons.Sparkles size={14}/> Plataforma de Gestão Libris
                  </span>
                                <h1 className="text-3xl md:text-5xl font-black tracking-tight leading-tight">
                                  O seu acervo sob <span className="text-gradient">controlo absoluto.</span>
                                </h1>
                                <p className="text-book-subtext text-sm md:text-base leading-relaxed">
                                  Organize o seu catálogo de livros com capas visuais, inventário em tempo real e análise financeira.
                                </p>
                              </div>
                            </section>

                            {/* Métrica / Cards de Resumo */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                              <div className="glass-card p-6 rounded-2xl relative overflow-hidden">
                                <p className="text-book-subtext text-xs font-bold uppercase tracking-wider">Títulos Registados</p>
                                <p className="text-3xl font-black mt-2 text-white">{livros.length}</p>
                              </div>
                              <div className="glass-card p-6 rounded-2xl relative overflow-hidden">
                                <p className="text-book-subtext text-xs font-bold uppercase tracking-wider">Exemplares em Stock</p>
                                <p className="text-3xl font-black mt-2 text-violet-400">{totalExemplares}</p>
                              </div>
                              <div className="glass-card p-6 rounded-2xl relative overflow-hidden border-emerald-500/20">
                                <p className="text-book-subtext text-xs font-bold uppercase tracking-wider">Valor Estimado do Acervo</p>
                                <p className="text-3xl font-black mt-2 text-emerald-400">{valorTotalAcervo.toFixed(2)} €</p>
                              </div>
                            </div>

                            {/* Filtros e Barra de Pesquisa */}
                            <div className="space-y-4">
                              <div className="flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between">
                                <div className="relative flex-1">
                                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-book-subtext">
                                    <Icons.Search/>
                                  </div>
                                  <input
                                          value={busca}
                                          onChange={e => setBusca(e.target.value)}
                                          placeholder="Pesquisar por título, autor, ISBN ou categoria..."
                                          className="w-full bg-book-surface border border-book-border rounded-2xl pl-11 pr-4 py-3 text-sm text-white focus:outline-none focus:border-violet-500 transition-all shadow-inner"
                                  />
                                  {busca && (
                                          <button onClick={() => setBusca('')} className="absolute right-3 top-3 text-xs text-book-subtext hover:text-white">✕</button>
                                  )}
                                </div>

                                <select
                                        value={ordenacao}
                                        onChange={e => setOrdenacao(e.target.value)}
                                        className="bg-book-surface border border-book-border rounded-2xl px-4 py-3 text-sm font-semibold outline-none text-book-subtext focus:text-white"
                                >
                                  <option value="RECENTES">Ordenar: Mais Recentes</option>
                                  <option value="PRECO_MENOR">Preço: Menor para Maior</option>
                                  <option value="PRECO_MAIOR">Preço: Maior para Menor</option>
                                  <option value="STOCK">Maior Quantidade em Stock</option>
                                </select>
                              </div>

                              <div className="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar">
                                {[
                                  ['TODOS', 'Todas as Categorias'],
                                  ['FICCAO', 'Ficção'],
                                  ['NAO_FICCAO', 'Não-Ficção'],
                                  ['TECNICO', 'Técnico'],
                                  ['BIOGRAFIA', 'Biografia'],
                                  ['INFANTIL', 'Infantil']
                                ].map(([val, label]) => (
                                        <button
                                                key={val}
                                                onClick={() => setFiltro(val)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                                        filtro === val
                                                                ? 'bg-violet-600 text-white shadow-glow-violet'
                                                                : 'bg-book-surface/60 text-book-subtext hover:bg-book-card hover:text-white border border-book-border/40'
                                                }`}
                                        >
                                          {label}
                                        </button>
                                ))}
                              </div>
                            </div>

                            {/* Grid de Cards de Livros com Imagem */}
                            {filtrados.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-12 text-center space-y-4">
                                      <div className="w-16 h-16 mx-auto rounded-2xl bg-violet-500/10 text-violet-400 flex items-center justify-center">
                                        <Icons.Book size={32}/>
                                      </div>
                                      <h3 className="text-lg font-bold">Nenhum livro encontrado</h3>
                                      <p className="text-book-subtext text-sm max-w-md mx-auto">Tente ajustar os filtros da pesquisa ou efetue o registo de uma nova obra.</p>
                                    </div>
                            ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                      {filtrados.map((l) => (
                                              <article key={l.id} className="glass-card rounded-2xl p-5 hover:border-violet-500/40 hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between group">
                                                <div className="space-y-4">
                                                  {/* Imagem de Capa e Badges */}
                                                  <div className="flex gap-4">
                                                    <div className="w-24 h-32 shrink-0 rounded-xl overflow-hidden bg-black/40 border border-white/10 relative group-hover:shadow-glow-violet transition-all">
                                                      {l.imagemUrl ? (
                                                              <img
                                                                      src={l.imagemUrl}
                                                                      alt={l.titulo}
                                                                      className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                                                      onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                                                              />
                                                      ) : null}
                                                      <div className="w-full h-full flex items-center justify-center bg-gradient-to-tr from-violet-900/40 to-pink-900/40 text-violet-300" style={{ display: l.imagemUrl ? 'none' : 'flex' }}>
                                                        <Icons.Book size={28}/>
                                                      </div>
                                                    </div>

                                                    <div className="flex-1 min-w-0 space-y-2">
                                                      <div className="flex flex-wrap gap-1.5 items-center">
                              <span className={`px-2.5 py-0.5 rounded-full text-[9px] font-black border uppercase tracking-wider ${getCategoriaBadge(l.categoria)}`}>
                                {l.categoria}
                              </span>
                                                        <span className={`text-[9px] font-extrabold px-2 py-0.5 rounded-full ${
                                                                l.quantidadeEstoque > 5 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                                                        l.quantidadeEstoque > 0 ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                                                                                'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                                        }`}>
                                {l.quantidadeEstoque > 0 ? `${l.quantidadeEstoque} em stock` : 'Esgotado'}
                              </span>
                                                      </div>

                                                      <h3 className="font-extrabold text-base text-white group-hover:text-violet-300 transition-colors line-clamp-2 leading-snug">{l.titulo}</h3>
                                                      <p className="text-book-subtext text-xs font-medium truncate">{l.autor || 'Autor não especificado'}</p>
                                                      {l.anoPublicacao && <p className="text-book-subtext text-[11px] font-semibold">{l.anoPublicacao}</p>}
                                                    </div>
                                                  </div>

                                                  {l.resumo && (
                                                          <p className="text-xs text-book-subtext/80 line-clamp-2 leading-relaxed">{l.resumo}</p>
                                                  )}

                                                  <div className="grid grid-cols-2 gap-2 pt-1 text-xs">
                                                    <div className="bg-black/30 p-2.5 rounded-xl border border-white/5">
                                                      <span className="text-book-subtext block text-[9px] uppercase font-bold">Preço</span>
                                                      <b className="text-violet-300 text-sm font-black">{l.preco != null ? `${Number(l.preco).toFixed(2)} €` : 'N/D'}</b>
                                                    </div>
                                                    <div className="bg-black/30 p-2.5 rounded-xl border border-white/5">
                                                      <span className="text-book-subtext block text-[9px] uppercase font-bold">ISBN</span>
                                                      <b className="text-slate-300 font-mono text-[11px] truncate block">{l.isbn || 'Sem ISBN'}</b>
                                                    </div>
                                                  </div>
                                                </div>

                                                <div className="flex items-center gap-2 mt-5 pt-4 border-t border-white/5">
                                                  <button onClick={() => setVisualizando(l)} className="p-2.5 rounded-xl border border-book-border hover:bg-violet-500/10 hover:text-violet-300 transition-all text-xs font-bold flex items-center justify-center gap-1.5 flex-1">
                                                    <Icons.Eye size={15}/> Ver
                                                  </button>
                                                  <button onClick={() => editar(l)} className="p-2.5 rounded-xl border border-book-border hover:bg-white/5 transition-all text-xs font-bold flex items-center justify-center gap-1.5 flex-1">
                                                    <Icons.Edit size={15}/> Editar
                                                  </button>
                                                  <button onClick={() => setDeletando(l.id)} className="p-2.5 rounded-xl border border-rose-500/20 text-rose-400 hover:bg-rose-500/10 transition-all text-xs font-bold">
                                                    <Icons.Trash size={15}/>
                                                  </button>
                                                </div>
                                              </article>
                                      ))}
                                    </div>
                            )}
                          </>
                  ) : (
                          /* Formulário com campo de Imagem */
                          <section className="max-w-3xl mx-auto space-y-6">
                            <button onClick={() => { setTela('principal'); setEditando(null); setForm(EMPTY); }} className="text-book-subtext hover:text-white text-xs font-bold flex items-center gap-2">
                              ← Voltar ao Catálogo
                            </button>

                            <div className="glass-card rounded-3xl overflow-hidden border-violet-500/30">
                              <div className="hero-bg p-8 border-b border-book-border/50">
                                <span className="text-violet-400 text-xs font-black uppercase tracking-widest block mb-1">Formulário do Acervo</span>
                                <h1 className="text-2xl md:text-3xl font-black">{editando !== null ? 'Atualizar Dados do Livro' : 'Registar Nova Obra'}</h1>
                              </div>

                              <form onSubmit={guardar} className="p-8 space-y-6">
                                <div>
                                  <label className={label}>Título do Livro *</label>
                                  <input required value={form.titulo} onChange={e => setForm({ ...form, titulo: e.target.value })} placeholder="Ex.: Mensagem" className={field}/>
                                </div>

                                <div>
                                  <label className={label}>URL da Capa / Imagem</label>
                                  <div className="flex gap-3 items-center">
                                    <input value={form.imagemUrl} onChange={e => setForm({ ...form, imagemUrl: e.target.value })} placeholder="Ex.: https://exemplo.com/capa.jpg" className={field}/>
                                    {form.imagemUrl && (
                                            <div className="w-12 h-12 shrink-0 rounded-xl overflow-hidden border border-violet-500/40 bg-black/50">
                                              <img src={form.imagemUrl} alt="Preview" className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'}/>
                                            </div>
                                    )}
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                  <div>
                                    <label className={label}>Categoria *</label>
                                    <select required value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })} className={field}>
                                      <option value="FICCAO">Ficção</option>
                                      <option value="NAO_FICCAO">Não-Ficção</option>
                                      <option value="TECNICO">Técnico / Académico</option>
                                      <option value="BIOGRAFIA">Biografia</option>
                                      <option value="INFANTIL">Infantil</option>
                                      <option value="OUTRO">Outro</option>
                                    </select>
                                  </div>
                                  <div>
                                    <label className={label}>Autor / Autora</label>
                                    <input value={form.autor} onChange={e => setForm({ ...form, autor: e.target.value })} placeholder="Ex.: Fernando Pessoa" className={field}/>
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                  <div>
                                    <label className={label}>Código ISBN</label>
                                    <input value={form.isbn} onChange={e => setForm({ ...form, isbn: e.target.value })} placeholder="Ex.: 978-972-0-00000-0" className={field}/>
                                  </div>
                                  <div>
                                    <label className={label}>Ano de Publicação</label>
                                    <input type="number" min="1000" max="2030" value={form.anoPublicacao} onChange={e => setForm({ ...form, anoPublicacao: e.target.value })} placeholder="Ex.: 1934" className={field}/>
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                  <div>
                                    <label className={label}>Preço de Venda (€)</label>
                                    <input type="number" min="0" step="0.01" value={form.preco} onChange={e => setForm({ ...form, preco: e.target.value })} placeholder="Ex.: 14.50" className={field}/>
                                  </div>
                                  <div>
                                    <label className={label}>Quantidade em Stock</label>
                                    <input type="number" min="0" value={form.quantidadeEstoque} onChange={e => setForm({ ...form, quantidadeEstoque: e.target.value })} placeholder="Ex.: 20" className={field}/>
                                  </div>
                                </div>

                                <div>
                                  <label className="flex items-center gap-3 p-4 bg-book-dark/60 border border-book-border/80 rounded-2xl cursor-pointer hover:border-violet-500/50 transition-all">
                                    <input type="checkbox" checked={form.disponivel} onChange={e => setForm({ ...form, disponivel: e.target.checked })} className="w-5 h-5 accent-violet-600 rounded"/>
                                    <div>
                                      <b className="block text-sm font-bold">Obra Disponível para Comercialização</b>
                                    </div>
                                  </label>
                                </div>

                                <div>
                                  <label className={label}>Sinopse / Resumo</label>
                                  <textarea rows="4" value={form.resumo} onChange={e => setForm({ ...form, resumo: e.target.value })} placeholder="Breve descrição sobre a obra..." className={field}></textarea>
                                </div>

                                <div className="flex flex-col-reverse sm:flex-row gap-4 pt-4">
                                  <button type="button" onClick={() => { setTela('principal'); setEditando(null); setForm(EMPTY); }} className="flex-1 py-3.5 rounded-2xl border border-book-border font-bold text-xs hover:bg-white/5 transition-all">
                                    Cancelar
                                  </button>
                                  <button type="submit" className="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-violet-600 to-pink-600 text-white font-black text-xs shadow-glow-violet hover:opacity-90 transition-all">
                                    {editando !== null ? 'Guardar Alterações (PUT)' : 'Registar Livro (POST)'}
                                  </button>
                                </div>
                              </form>
                            </div>
                          </section>
                  )}
                </div>
              </main>

              {/* Modal de Pré-visualização com Capa Grande */}
              {visualizando && (
                      <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="glass-modal max-w-lg w-full p-8 rounded-3xl space-y-6 relative">
                          <button onClick={() => setVisualizando(null)} className="absolute top-6 right-6 text-book-subtext hover:text-white text-lg font-bold">✕</button>

                          <div className="flex gap-5 items-start">
                            <div className="w-28 h-40 shrink-0 rounded-2xl overflow-hidden bg-black/50 border border-violet-500/30 shadow-glow-violet">
                              {visualizando.imagemUrl ? (
                                      <img src={visualizando.imagemUrl} alt={visualizando.titulo} className="w-full h-full object-cover"/>
                              ) : (
                                      <div className="w-full h-full flex items-center justify-center text-violet-300">
                                        <Icons.Book size={32}/>
                                      </div>
                              )}
                            </div>

                            <div className="space-y-2 flex-1">
                <span className={`px-3 py-1 rounded-full text-[10px] font-black border uppercase tracking-wider ${getCategoriaBadge(visualizando.categoria)}`}>
                  {visualizando.categoria}
                </span>
                              <h2 className="text-xl font-black text-white leading-snug">{visualizando.titulo}</h2>
                              <p className="text-violet-300 font-bold text-sm">{visualizando.autor || 'Autor não especificado'}</p>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3 text-xs bg-black/40 p-4 rounded-2xl border border-white/5">
                            <div><span className="text-book-subtext block text-[9px] uppercase font-bold">Preço</span><b className="text-base text-emerald-400 font-black">{visualizando.preco != null ? `${Number(visualizando.preco).toFixed(2)} €` : 'N/D'}</b></div>
                            <div><span className="text-book-subtext block text-[9px] uppercase font-bold">Stock</span><b className="text-base text-violet-300 font-black">{visualizando.quantidadeEstoque} un.</b></div>
                            <div><span className="text-book-subtext block text-[9px] uppercase font-bold">ISBN</span><b className="text-slate-300 font-mono">{visualizando.isbn || 'N/D'}</b></div>
                            <div><span className="text-book-subtext block text-[9px] uppercase font-bold">Ano</span><b className="text-slate-300">{visualizando.anoPublicacao || 'N/D'}</b></div>
                          </div>

                          {visualizando.resumo && (
                                  <div className="space-y-1">
                                    <span className="text-book-subtext text-[10px] font-bold uppercase tracking-wider block">Sinopse</span>
                                    <p className="text-xs text-slate-300 leading-relaxed bg-white/5 p-4 rounded-2xl">{visualizando.resumo}</p>
                                  </div>
                          )}

                          <div className="flex gap-3">
                            <button onClick={() => editar(visualizando)} className="flex-1 py-3 rounded-2xl bg-violet-600 text-white font-bold text-xs shadow-glow-violet">
                              Editar Obra
                            </button>
                          </div>
                        </div>
                      </div>
              )}

              {/* Modal Configuração API */}
              {showConfig && (
                      <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="glass-modal max-w-lg w-full p-8 rounded-3xl space-y-6">
                          <h3 className="font-black text-xl">Configurar Endpoint REST</h3>
                          <input value={urlEdit} onChange={e => setUrlEdit(e.target.value)} placeholder="http://localhost:8080/api/livros" className={field}/>
                          <div className="flex gap-3">
                            <button onClick={() => setShowConfig(false)} className="flex-1 py-3 rounded-2xl border border-book-border text-xs font-bold">Cancelar</button>
                            <button onClick={() => { if (urlEdit.trim()) { setApiUrl(urlEdit.trim().replace(/\/$/, '')); setShowConfig(false); } }} className="flex-1 py-3 rounded-2xl bg-violet-600 text-white font-extrabold text-xs shadow-glow-violet">Guardar e Testar</button>
                          </div>
                        </div>
                      </div>
              )}

              {/* Modal Confirmação Exclusão */}
              {deletando !== null && (
                      <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="glass-modal max-w-sm w-full p-6 rounded-3xl text-center space-y-5">
                          <div className="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto">
                            <Icons.Trash size={24}/>
                          </div>
                          <h3 className="font-black text-lg">Eliminar este livro?</h3>
                          <div className="flex gap-3">
                            <button onClick={() => setDeletando(null)} className="flex-1 py-3 rounded-2xl border border-book-border font-bold text-xs">Cancelar</button>
                            <button onClick={() => eliminar(deletando)} className="flex-1 py-3 rounded-2xl bg-rose-600 text-white font-extrabold text-xs">Eliminar</button>
                          </div>
                        </div>
                      </div>
              )}
            </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
